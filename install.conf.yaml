- defaults:
    link:
      relink: true

- clean: ["~"]

- create:
    - ~/.config/zsh
    - ~/.config/tmux

- link:
    ~/.config/bat:
    ~/.config/broot:
    ~/.config/fish:
    ~/.config/env:
    ~/.config/gh:
    ~/.config/ghostty:
    ~/.config/git:
    ~/.config/kanata:
    ~/.config/karabiner:
    ~/.config/mise:
    ~/.config/mole:
    ~/.config/mutt:
    ~/.config/nvim-vscode:
    ~/.config/starship:
    ~/.config/tmux/tmux.conf: tmux/tmux.conf
    ~/.config/zed: 
    ~/.config/zsh-abbr:
    ~/.config/zsh/.zshrc: zsh/zshrc
    ~/.zshenv: zsh/zshenv


- shell:
    - echo "Operation complete"
