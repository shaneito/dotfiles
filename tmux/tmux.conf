#!/usr/local/bin/tmux

# To load plugins press prefix + I (capital i, as in Install)

# ====================
# KEY BINDING
# ====================

# Set prefix to Ctrl-Space
unbind C-b
set -g prefix C-Space
set -g default-terminal "screen-256color"

# Quick key for moving back to the previous window (tmux book)
bind-key -r j previous-window
bind-key -r k next-window
bind-key l last-window

# force a reload of the config file
unbind r
bind-key r source-file "$XDG_CONFIG_HOME/tmux/tmux.conf" \; display "Reloaded tmux conf"

# set window split
unbind v
unbind h
unbind % #Split vertically
unbind '"' # Split horizontally
bind v split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"

# vim pane selection
bind -n C-h select-pane -L
bind -n C-j select-pane -D
bind -n C-k select-pane -U
bind -n C-l select-pane -R

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
| grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
bind -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# pane resize
bind -r Left  resize-pane -L 5
bind -r Down  resize-pane -D 5
bind -r Up    resize-pane -U 5
bind -r Right resize-pane -R 5

# pane movement to window
# bind j command-prompt -p "join pane from:"  "join-pane -s '%%'"
# bind s command-prompt -p "send pane to:"  "join-pane -t '%%'"

unbind a
bind a choose-tree -Zs

# mouse mode
set -g mouse on

bind m \
    set -g mouse on \; \
    display 'Mouse: ON'

bind M \
    set -g mouse off \; \
    display 'Mouse: OFF'

# Alt j/k key to switch windows
bind -n M-j previous-window
bind -n M-k next-window

# Make a smaller delay so we can perform commands after switching windows
set -sg escape-time 0
set -sg repeat-time 600

# Window title begins by 1 and not 0
set -g base-index 1
set-window-option -g pane-base-index 1

# window management
unbind n #DEFAULT KEY: Move to next window
unbind w #DEFAULT KEY: Move to next window

bind n command-prompt "rename-window '%%'"
bind w new-window -c "#{pane_current_path}"

# panes
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

# Renumber windows automatically after removing a window
set-option -g renumber-windows on

# Scrollback lines
set -g history-limit 10000

# Rather than constraining window size to the maximum size of any client
# connected to the *session*, constrain window size to the maximum size of any
# client connected to *that window*.
setw -g aggressive-resize on

# Prevent tmux from renaming the tab when processes change (from tmux book)
# e.g. if you're in a directory which is a git repo and you fire up Pry then
# tmux would first rename the tab to 'java' (for Pry) then 'git' when exiting Pry, then finally back to 'zsh'
# set-option -g allow-rename off

# Tells tmux up front what shell to expect (from tmux book)
# set-option -g default-shell /bin/zsh
set -s set-clipboard on
set-option -g default-command "exec reattach-to-user-namespace -l zsh"

# vim key mode
setw -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe "reattach-to-user-namespace pbcopy"
bind-key -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'reattach-to-user-namespace pbcopy'
bind-key p paste-buffer

# nvim compatibility - fix the cursor problem
# set -g -a terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

##############
### DESIGN ###
##############

# Catppuccin Frappé styling
set -g @catppuccin_flavor 'frappe'
set -g @catppuccin_status_background 'default'
set -g @catppuccin_window_status_style 'rounded'

# Basic tmux chrome tuned to the theme
set -g status-position bottom
set -g status-justify left
set -g status-style bg=default,fg=default
set -g status-left ''
set -g status-right '#{?client_prefix,#[fg=#e78284]prefix pressed ..,#[fg=#c6d0f5]#H}'
set -g status-right-length 50
set -g status-left-length 20
set -g status-interval 2

set -g pane-border-style fg='#626880'
set -g pane-active-border-style fg='#c6d0f5'
setw -g mode-style fg='#c6d0f5',bg=default
set-window-option -g clock-mode-colour '#ef9f76'
set-window-option -g window-status-bell-style fg='#ffffff',bg='#e78284',bold
set -g message-style fg='#c6d0f5',bg=default
set -g message-command-style fg='#c6d0f5',bg=default
set-window-option -g monitor-activity off
set -g bell-action none

# Window appearance
set-window-option -g window-status-current-style fg='#303446',bg='#ca9ee6',bold
set-window-option -g window-status-current-format ' #I#[fg=#303446]:#[fg=#303446]#W#[fg=#303446]#F '
set-window-option -g window-status-style fg='#c6d0f5',bg=default,none
set-window-option -g window-status-format ' #I#[fg=#c6d0f5]:#[fg=#c6d0f5]#W#[fg=#626880]#F '

# loud or quiet?
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off

###############
### PLUGINS ###
###############

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'catppuccin/tmux#v2.3.2' # See https://github.com/catppuccin/tmux/tags for additional tags

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run -b "$(brew --prefix)/opt/tpm/share/tpm/tpm"
